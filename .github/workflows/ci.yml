name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CHROME_VERSION: 155.0.8059.39
  CHROME_SHA256: 55672d1f392fd3e7b7a08621b6e804e6bcb39d40cf155504abb74b3a021ea8ea
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Chromium
        run: |
          curl -fsSL -o "$RUNNER_TEMP/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-linux64.zip"
          echo "$CHROME_SHA256  $RUNNER_TEMP/chrome.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$RUNNER_TEMP"
          echo "CHROMIUM=$RUNNER_TEMP/chrome-linux64/chrome" >> "$GITHUB_ENV"
          # Ubuntu 24.04 denies user namespaces to a browser with no AppArmor profile, and the sandbox needs them.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Chromium starts with its sandbox
        run: |
          "$CHROMIUM" --version
          "$CHROMIUM" --headless=new --disable-gpu --dump-dom about:blank > /dev/null
      - run: npm run smoke:preview
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: |
          curl -fsSL -o "$RUNNER_TEMP/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-linux64.zip"
          echo "$CHROME_SHA256  $RUNNER_TEMP/chrome.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$RUNNER_TEMP"
          echo "CHROMIUM=$RUNNER_TEMP/chrome-linux64/chrome" >> "$GITHUB_ENV"
          # Ubuntu 24.04 denies user namespaces to a browser with no AppArmor profile, and the sandbox needs them.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Chromium starts with its sandbox
        run: |
          "$CHROMIUM" --version
          "$CHROMIUM" --headless=new --disable-gpu --dump-dom about:blank > /dev/null
      - run: npm run build:cloudflare
      - run: npm run smoke:wrangler
